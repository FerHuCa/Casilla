<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casilla: entrenamiento de ajedrez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&family=Manrope:wght@400;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500;600&family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
:root{
  --bw:min(calc(100vh - 190px), calc(100vw - 540px), 680px);
  --fBody:'Source Sans 3',system-ui,sans-serif; --fHead:'Source Serif 4',Georgia,serif;
  --bg:#242322; --raise:#2C2B29; --line:#3B3936; --line2:#4A4844;
  --text:#E7E3DC; --muted:#A09A90; --faint:#76716A;
  --good:#8DB27F; --bad:#CF7B6B; --warn:#CDAA62; --orange:#D4905E;
  --onText:#1F1E1D; --textHover:#FFFFFF; --rowline:#2F2E2C; --cur:#3A3835;
  --evalbg:#3A3835; --evalfill:#E9E6E0; --veil:rgba(36,35,34,.78); --frame:#1A1918;
  --sqL:#D3D0C9; --sqD:#8F8B83;
  color-scheme:dark;
}
html[data-theme=papel]{
  --bg:#F3F3F0; --raise:#E8E7E2; --line:#DAD8D2; --line2:#C3C0B8;
  --text:#1E1E1C; --muted:#5F5C56; --faint:#8B877F;
  --good:#3B7537; --bad:#A3412D; --warn:#87661B; --orange:#97582A;
  --onText:#F3F3F0; --textHover:#000000; --rowline:#E3E1DC; --cur:#E1DFD9;
  --evalbg:#3A3835; --evalfill:#FFFFFF; --veil:rgba(243,243,240,.82); --frame:#B9B5AD;
  color-scheme:light;
}
html[data-theme=pizarra]{
  --bg:#1F252B; --raise:#28313A; --line:#35414D; --line2:#46535F;
  --text:#E2E7EB; --muted:#93A1AD; --faint:#6B7985;
  --good:#8DB79A; --bad:#D27F72; --warn:#D2B063; --orange:#D69563;
  --onText:#1A1F24; --textHover:#FFFFFF; --rowline:#29323B; --cur:#334050;
  --evalbg:#35414D; --evalfill:#E8EDF0; --veil:rgba(31,37,43,.8); --frame:#161B20;
}
html[data-theme=cuero]{
  --bg:#28211B; --raise:#322921; --line:#43372C; --line2:#564638;
  --text:#EEE5D8; --muted:#B39F89; --faint:#87745F;
  --good:#9DB57F; --bad:#D58468; --warn:#D7AE62; --orange:#D9925A;
  --onText:#241D17; --textHover:#FFFFFF; --rowline:#352B23; --cur:#43372C;
  --evalbg:#43372C; --evalfill:#F1E9DD; --veil:rgba(40,33,27,.8); --frame:#1A1511;
}
html[data-font=moderna]{--fBody:'Manrope',system-ui,sans-serif;--fHead:'Manrope',system-ui,sans-serif}
html[data-font=libro]{--fBody:'Literata',Georgia,serif;--fHead:'Literata',Georgia,serif}
html[data-font=tecnica]{--fBody:'IBM Plex Sans',system-ui,sans-serif;--fHead:'IBM Plex Mono',ui-monospace,monospace}
html[data-board=madera]{--sqL:#EED8B5;--sqD:#B08660}
html[data-board=nogal]{--sqL:#D6B48E;--sqD:#86593B}
html[data-board=glaciar]{--sqL:#DCE3E8;--sqD:#7E99AC}
html[data-board=club]{--sqL:#E7E9D6;--sqD:#7D9971}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--fBody);min-height:100vh;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
h2{font-family:var(--fHead);font-weight:600;font-size:24px;letter-spacing:-.005em;margin:0 0 4px;line-height:1.2}
h3{font-family:var(--fHead);font-weight:600;font-size:17px;margin:26px 0 6px}
p{margin:0 0 10px}
.lede{color:var(--muted);max-width:56ch}
a{color:var(--text);text-decoration-color:var(--faint);text-underline-offset:3px}
a:hover{text-decoration-color:var(--text)}

/* encabezado */
.top{display:flex;align-items:baseline;gap:34px;padding:0 32px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--fHead);font-weight:600;font-size:22px;padding:16px 0}
.brand .mark{display:none}
.tabs{display:flex;gap:24px;flex-wrap:wrap}
.tab{background:none;border:0;color:var(--muted);padding:18px 0 15px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--text)}
.pill{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--faint);font-size:13px}
.led{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.pill.ok .led{background:var(--good)}
.pill.err .led{background:var(--bad)}
.pill.err{color:var(--bad)}

/* estructura */
main{display:grid;grid-template-columns:auto minmax(320px,400px);gap:48px;padding:28px 32px 40px;justify-content:center;align-items:start}
.board-row{display:flex;gap:10px;align-items:stretch}
.evalbar{width:18px;height:var(--bw);border-radius:2px;overflow:hidden;position:relative;background:var(--evalbg);flex:none}
.evalbar .fill{position:absolute;left:0;right:0;bottom:0;height:50%;background:var(--evalfill);transition:height .35s ease}
.evalbar.flip .fill{bottom:auto;top:0}
.evalbar .evtxt{position:absolute;left:0;right:0;bottom:5px;font-size:10px;font-weight:600;line-height:1;text-align:center;white-space:nowrap;writing-mode:vertical-rl;transform:rotate(180deg);color:#1F1E1D}
.evalbar.neg .evtxt{bottom:auto;top:5px;color:#E9E6E0}
.evalbar.flip .evtxt{bottom:auto;top:5px}
.evalbar.flip.neg .evtxt{top:auto;bottom:5px}
.evalbar.off{visibility:hidden}
.board-box{position:relative;width:var(--bw);height:var(--bw);flex:none}
.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 0 0 1px var(--frame),0 10px 30px rgba(0,0,0,.35)}
.sq{position:relative}
.sq.l{background:var(--sqL)} .sq.d{background:var(--sqD)}
.sq.last::before,.sq.sel::before,.sq.mk-good::before,.sq.mk-bad::before,.sq.mk-hint::before{content:'';position:absolute;inset:0}
.sq.last::before{background:rgba(205,190,120,.45)}
.sq.sel::before{background:rgba(110,140,90,.6)}
.sq.mk-good::before{background:rgba(110,160,95,.6)}
.sq.mk-bad::before{background:rgba(190,90,70,.6)}
.sq.mk-hint::before{box-shadow:inset 0 0 0 3px #3F6C9E}
.sq.chk{background-image:radial-gradient(circle,rgba(200,50,40,.9) 0,rgba(200,50,40,.5) 40%,transparent 70%)}
.sq .dot{position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:rgba(30,30,28,.28);z-index:3;pointer-events:none}
.sq .cap{position:absolute;inset:0;background:radial-gradient(transparent 64%,rgba(30,30,28,.3) 65%);z-index:3;pointer-events:none}
.pc{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;z-index:2;cursor:grab}
.sq.dragfrom .pc{opacity:.3}
.coord{position:absolute;font-size:calc(var(--bw)*.02);font-weight:600;z-index:1;pointer-events:none;line-height:1}
.coord.f{right:4%;bottom:4%} .coord.r{left:4%;top:4%}
.sq.l .coord{color:var(--sqD)} .sq.d .coord{color:var(--sqL)}
#arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.ghost{position:fixed;pointer-events:none;z-index:100}
.ghost .pc{cursor:grabbing}
.promo{position:absolute;inset:0;background:var(--veil);display:flex;align-items:center;justify-content:center;gap:8px;z-index:20}
.promo[hidden]{display:none}
.promo button{width:calc(var(--bw)*.14);height:calc(var(--bw)*.14);border:0;border-radius:4px;background:var(--sqL);cursor:pointer;position:relative}
.promo button:hover{filter:brightness(1.06)}
.under{margin-top:18px;display:flex;flex-direction:column;gap:12px;max-width:calc(var(--bw) + 28px)}
.status{min-height:24px;color:var(--text)}
.status.good{color:var(--good)} .status.bad{color:var(--bad)} .status.warn{color:var(--warn)}
.controls{display:flex;gap:6px;flex-wrap:wrap}

/* panel lateral */
.side{padding:4px 0 24px;max-height:calc(100vh - 110px);overflow:auto}
.back{background:none;border:0;color:var(--muted);padding:0;margin-bottom:14px;cursor:pointer;font-size:14px}
.back:hover{color:var(--text)}
.btn{border:1px solid var(--line2);background:transparent;padding:7px 13px;border-radius:4px;cursor:pointer;font-size:14px}
.btn:hover:not(:disabled){background:var(--raise)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--text);color:var(--onText);border-color:var(--text);font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--textHover);border-color:var(--textHover)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.wide{width:100%;margin-top:14px;padding:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{margin:16px 0}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.seg{display:inline-flex;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 0;cursor:pointer;color:var(--muted);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{color:var(--text);border-bottom-color:var(--text)}
input[type=text],select,textarea{background:var(--raise);border:1px solid var(--line2);color:var(--text);border-radius:4px;padding:7px 10px;font:inherit;width:100%}
textarea{min-height:64px;font-size:13px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--muted);margin:14px 0;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

/* cifras como lista de datos */
.stats{display:flex;flex-direction:column;margin:12px 0 4px;border-top:1px solid var(--line)}
.stat{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.stat span:last-child{color:var(--muted);font-size:14px}
.big{font-weight:600;font-size:15px;text-align:right;max-width:60%}
.result{padding:2px 0 2px 12px;margin:16px 0;border-left:2px solid var(--line2)}
.result.good{border-left-color:var(--good)} .result.bad{border-left-color:var(--bad)} .result.warn{border-left-color:var(--warn)}
.result strong{display:block;font-weight:600}

/* escalera */
.stairs{list-style:none;padding:0;margin:14px 0 4px;border-top:1px solid var(--line)}
.stair{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:0 12px;padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.stair:hover{background:var(--raise)}
.stair .sg{width:26px;height:26px;position:relative}
.stair .sg .pc{cursor:inherit}
.stair .sn{line-height:1.3}
.stair .sn small{display:block;font-size:12px;color:var(--muted)}
.stair .se{font-size:13px;color:var(--muted);text-align:right}
.stair.sel{background:var(--raise);box-shadow:inset 2px 0 0 var(--text)}
.stair.beaten .sn::after{content:'  superado';font-size:12px;color:var(--good)}
.stair.locked{cursor:not-allowed}
.stair.locked .sg{opacity:.35}
.stair.locked .sn{color:var(--faint)}

/* listas */
.list{list-style:none;padding:0;margin:8px 0;border-top:1px solid var(--line)}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
.item .row{margin-top:8px}
.tag{display:inline-block;font-size:12px;color:var(--muted);margin-right:10px}
.tag + .tag::before{content:'';}
.tag.done{color:var(--good)}
.tag.todo{color:var(--warn)}
.daysteps .item{display:flex;justify-content:space-between;align-items:center;gap:12px}
.daysteps .item .row{margin-top:0;flex:none}
.daysteps .item.off .t{color:var(--muted);font-weight:500}
.checks .item{padding:9px 0}
.games{list-style:none;padding:0;margin:10px 0;border-top:1px solid var(--line)}
.game{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.game:hover{background:var(--raise)}
.game .c{width:9px;height:9px;border-radius:50%;border:1px solid var(--faint)}
.game .c.w{background:#E7E3DC} .game .c.b{background:#1C1B1A}
.game .o{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game .meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res{font-weight:600;font-size:14px;min-width:18px;text-align:right}
.res.w{color:var(--good)} .res.l{color:var(--bad)} .res.d{color:var(--muted)}
.bar{height:4px;background:var(--line);margin:4px 0 12px}
.bar>i{display:block;height:100%;background:var(--muted)}
.prog{height:3px;background:var(--line);overflow:hidden;margin:10px 0}
.prog>i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.explain{margin-top:6px}
.explain h3{font-size:15px;margin:18px 0 4px}
.explain p{margin:0 0 6px;color:var(--text)}
.explain b{font-weight:600}
.explain .line{font-size:13px;color:var(--muted);padding:6px 0 6px 10px;border-left:2px solid var(--line2)}
.clock{display:flex;justify-content:space-between;align-items:center;width:var(--bw);margin-left:28px;font-size:14px;color:var(--muted)}
#clockTop{margin-bottom:8px}
.clock[hidden]{display:none}
.clock .tm{font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;padding:1px 10px;border-radius:4px;background:var(--raise);color:var(--muted);min-width:86px;text-align:right}
.clock.on .tm{background:var(--text);color:var(--onText)}
.clock.low .tm{color:var(--bad)}
.clock.on.low .tm{background:var(--bad);color:#fff}
html.clocked{--bw:min(calc(100vh - 280px), calc(100vw - 540px), 680px)}
.feed{border-top:1px solid var(--line);max-height:340px;overflow:auto;margin-bottom:6px}
.msg{padding:9px 0 9px 10px;border-bottom:1px solid var(--line);font-size:14px;box-shadow:inset 2px 0 0 var(--line2)}
.msg .who{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:2px}
.msg.warn{box-shadow:inset 2px 0 0 var(--warn)} .msg.bad{box-shadow:inset 2px 0 0 var(--bad)} .msg.good{box-shadow:inset 2px 0 0 var(--good)} .msg.sum{box-shadow:inset 2px 0 0 var(--text)}
.msg .line{font-size:13px;color:var(--muted);margin:4px 0 0}
.msg .row{margin-top:8px}
.egraph{width:100%;height:auto;display:block;margin-top:14px;background:var(--evalbg);border-radius:3px}
.egraph .ga{fill:var(--evalfill)}
.egraph .gz{stroke:var(--faint);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:3 3}
.egraph .gc{stroke:var(--warn);stroke-width:2;vector-effect:non-scaling-stroke}
.egraph .gm{cursor:pointer;stroke:var(--bg);stroke-width:1.5;vector-effect:non-scaling-stroke}
.egraph .gm.b{fill:var(--bad)} .egraph .gm.m{fill:var(--orange)}
.narr p{margin:0 0 8px}
.moments{border-top:1px solid var(--line)}
.moment{border-bottom:1px solid var(--line);padding:10px 0 10px 12px;box-shadow:inset 2px 0 0 var(--warn)}
.moment.bad{box-shadow:inset 2px 0 0 var(--bad)} .moment.good{box-shadow:inset 2px 0 0 var(--good)}
.moment summary{cursor:pointer;font-weight:600;list-style:none}
.moment summary::-webkit-details-marker{display:none}
.moment summary::before{content:'+';display:inline-block;width:16px;color:var(--muted)}
.moment[open] summary::before{content:'−'}
.moment h4{font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 3px}
.moment p{margin:0 0 4px}
.moment .row{margin-top:10px}
.aline{margin:2px 0 4px;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.aline li{padding:2px 0}
.aline b{color:var(--text);font-weight:600}
.sync{background:none;border:0;cursor:pointer;color:var(--faint);font-size:13px;padding:0;margin-left:14px;display:inline-flex;align-items:center;gap:6px}
.sync[hidden]{display:none}
.sync::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.working::before,.sync.pending::before{background:var(--warn)}
.sync.err{color:var(--bad)} .sync.err::before{background:var(--bad)}
.steps{padding-left:20px;margin:6px 0 4px;font-size:14px}
.steps li{margin-bottom:6px}
.catrow{display:grid;grid-template-columns:1fr auto;font-size:14px}

/* jugadas */
.moves{position:relative;list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;max-height:240px;overflow:auto;font-size:14px;border-top:1px solid var(--line)}
.moves li{display:contents}
.moves .m{background:none;border:0;text-align:left;padding:4px 8px;cursor:pointer;border-bottom:1px solid var(--rowline)}
.moves .m:hover{background:var(--raise)}
.moves .m.cur{background:var(--cur)}
.moves .m.foc{box-shadow:inset 0 0 0 2px var(--warn)}
.mvnote{padding:8px 0 8px 12px;box-shadow:inset 2px 0 0 var(--line2)}
.mvnote.good{box-shadow:inset 2px 0 0 var(--good)} .mvnote.warn{box-shadow:inset 2px 0 0 var(--warn)} .mvnote.bad{box-shadow:inset 2px 0 0 var(--bad)}
.mvnote p{margin:4px 0 6px}
.mvh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.mvk{font-size:13px;color:var(--muted)}
.mvnote.good .mvk{color:var(--good)} .mvnote.warn .mvk{color:var(--warn)} .mvnote.bad .mvk{color:var(--bad)}
.moves .m .num{color:var(--faint);display:inline-block;min-width:26px;font-size:13px}
.moves .m sup{font-weight:600;margin-left:3px;font-size:11px}
.t-inacc sup{color:var(--warn)} .t-mistake sup{color:var(--orange)} .t-blunder sup{color:var(--bad)}
.lines{font-size:13px;margin:10px 0;border-top:1px solid var(--line)}
.lines div{padding:6px 0;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lines b{display:inline-block;min-width:52px;font-weight:600}
footer{color:var(--faint);font-size:12px;text-align:center;padding:0 20px 26px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cur);padding:9px 14px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;max-width:90vw}
#toast.on{opacity:1}
.spark{width:100%;height:56px;display:block;margin-top:6px;color:var(--muted)}
/* apariencia */
.lookbtn{background:none;border:0;color:var(--muted);cursor:pointer;padding:18px 0 15px;font-size:14px;margin-left:18px}
.lookbtn:hover,.lookbtn[aria-expanded=true]{color:var(--text)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:150;overflow:auto;padding:22px 24px 32px;box-shadow:-24px 0 48px rgba(0,0,0,.28)}
.drawer[hidden]{display:none}
.drawer .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{border:1px solid var(--line2);border-radius:6px;padding:8px;background:none;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:7px;color:var(--text)}
.opt:hover{background:var(--raise)}
.opt[aria-checked=true]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.opt .nm{font-size:13px}
.sw-theme{height:38px;border-radius:4px;display:flex;align-items:flex-end;justify-content:space-between;padding:6px 8px;font-size:12px}
.sw-theme i{display:block;width:26px;height:4px;border-radius:2px}
.sw-style{height:38px;display:flex;align-items:center;gap:8px;padding:0 6px}
.sw-style i{width:46px;height:20px;background:var(--line);border-radius:3px}
.sw-style b{width:20px;height:20px;background:var(--sqD);border-radius:2px}
.sw-style.relieve i{border-radius:7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.4)}
.sw-style.bits i{border:3px solid #000;box-shadow:3px 3px 0 #000;background:#ffcd75}
.sw-style.bits b{background:#3b5dc9;box-shadow:3px 3px 0 #000}
.sw-style.relieve b{box-shadow:0 3px 0 rgba(0,0,0,.4),0 4px 8px rgba(0,0,0,.3)}
.sw-font{font-size:21px;line-height:1.15}
.sw-font small{display:block;font-size:12px;opacity:.75}
.sw-board{display:grid;grid-template-columns:repeat(6,1fr);height:30px;border-radius:2px;overflow:hidden}
.sw-pieces{display:flex;width:100%;max-width:160px}
.sw-pieces span{flex:1 1 0;aspect-ratio:1;min-width:0;background-size:100% 100%}
.sw-pieces span:nth-child(odd){background-color:var(--sqL)} .sw-pieces span:nth-child(even){background-color:var(--sqD)}
@media (max-width:1000px){
  .drawer{top:auto;height:64vh;width:100%;border-left:0;border-top:1px solid var(--line);box-shadow:0 -20px 40px rgba(0,0,0,.28)}
  .lookbtn{margin-left:4px;padding:12px 0}
}
@media (max-width:1000px){
  :root{--bw:min(calc(100vw - 54px),580px)}
  main{grid-template-columns:1fr;padding:18px 16px 32px;gap:26px}
  .top{padding:0 16px;gap:0 14px;align-items:center}
  .brand{padding:12px 0}
  .tabs{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;gap:20px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 0 11px;white-space:nowrap}
  .pill{font-size:12px}
  .side{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* ---- Estilo con relieve (opcional) ---- */
html[data-style=relieve]{--bevel:rgba(0,0,0,.38);--hi:rgba(255,255,255,.07);--shadow:0 10px 28px rgba(0,0,0,.28)}
html[data-style=relieve][data-theme=papel]{--bevel:rgba(0,0,0,.18);--hi:rgba(255,255,255,.7);--shadow:0 10px 24px rgba(0,0,0,.12)}
html[data-style=relieve] .board{border-radius:4px;box-shadow:0 0 0 6px var(--line2),0 6px 0 6px var(--bevel),var(--shadow)}
html[data-style=relieve] .sq.l,html[data-style=relieve] .sq.d{background-image:linear-gradient(160deg,rgba(255,255,255,.09),rgba(0,0,0,.06))}
html[data-style=relieve] .pc{filter:drop-shadow(0 2px 1.6px rgba(0,0,0,.38))}
html[data-style=relieve] .board-row{margin-bottom:6px}
html[data-style=relieve] .evalbar{border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 3px 0 var(--bevel)}
html[data-style=relieve] .side{background:var(--raise);border-radius:12px;padding:20px 20px 24px;box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--bevel),var(--shadow)}
html[data-style=relieve] .btn{border:0;border-radius:8px;background:var(--line);box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--bevel);transition:transform .06s,box-shadow .06s;font-weight:600}
html[data-style=relieve] .btn:hover:not(:disabled){background:var(--line2)}
html[data-style=relieve] .btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 var(--hi),0 1px 0 var(--bevel)}
html[data-style=relieve] .btn.primary{background:var(--text);color:var(--onText);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 var(--bevel)}
html[data-style=relieve] .btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--bevel)}
html[data-style=relieve] .seg{border:0;background:var(--bg);border-radius:9px;padding:3px;gap:2px;box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
html[data-style=relieve] .seg button{border:0;border-radius:7px;padding:6px 11px;margin:0}
html[data-style=relieve] .seg button[aria-pressed=true]{background:var(--line);color:var(--text);box-shadow:inset 0 1px 0 var(--hi),0 2px 0 var(--bevel)}
html[data-style=relieve] .stairs,html[data-style=relieve] .list,html[data-style=relieve] .games,html[data-style=relieve] .moments{border-top:0}
html[data-style=relieve] .stair,html[data-style=relieve] .item,html[data-style=relieve] .game,html[data-style=relieve] .moment{border:0;border-radius:9px;background:var(--bg);margin-bottom:6px;box-shadow:0 2px 0 var(--bevel);padding-left:12px;padding-right:12px}
html[data-style=relieve] .stair.sel{background:var(--line);box-shadow:inset 3px 0 0 var(--text),0 2px 0 var(--bevel)}
html[data-style=relieve] .moment.bad{box-shadow:inset 3px 0 0 var(--bad),0 2px 0 var(--bevel)} html[data-style=relieve] .moment.good{box-shadow:inset 3px 0 0 var(--good),0 2px 0 var(--bevel)} html[data-style=relieve] .moment{box-shadow:inset 3px 0 0 var(--warn),0 2px 0 var(--bevel)}
html[data-style=relieve] .result,html[data-style=relieve] .tip,html[data-style=relieve] .msg{border-radius:8px;background:var(--bg)}
html[data-style=relieve] .clock .tm{border-radius:7px;box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--bevel)}
html[data-style=relieve] input[type=text],html[data-style=relieve] input[type=password],html[data-style=relieve] select,html[data-style=relieve] textarea{border-radius:8px;background:var(--bg);box-shadow:inset 0 2px 3px rgba(0,0,0,.2)}
html[data-style=relieve] .moves{border-radius:8px;background:var(--bg);border-top:0}
html[data-style=relieve] .stats{border-top:0}
html[data-style=relieve] .opt{border-radius:10px}
html[data-style=relieve] .promo button{border-radius:10px;box-shadow:0 4px 0 var(--bevel)}
html[data-style=relieve] h2{font-weight:700}
@media (max-width:1000px){ html[data-style=relieve] .side{padding:16px 14px 20px} }


/* ---- Tema, tablero, fuente y estilo 8 bits ---- */
html[data-theme=arcade]{
  --bg:#1a1c2c; --raise:#262b44; --line:#3a4466; --line2:#5a6988;
  --text:#f4f4f4; --muted:#94b0c2; --faint:#6b7f9e;
  --good:#38b764; --bad:#e04a62; --warn:#ffcd75; --orange:#ef7d57;
  --onText:#1a1c2c; --textHover:#ffffff; --rowline:#2c3150; --cur:#3a4466;
  --evalbg:#29366f; --evalfill:#f4f4f4; --veil:rgba(26,28,44,.85); --frame:#000;
}
html[data-board=arcade]{--sqL:#f4f4f4;--sqD:#3b5dc9}
html[data-font=pixel]{--fBody:'Pixelify Sans',system-ui,sans-serif;--fHead:'Press Start 2P',monospace}
html[data-font=pixel] h2{font-size:17px;line-height:1.5}
html[data-font=pixel] h3{font-size:12px;line-height:1.6}
html[data-font=pixel] .brand{font-size:15px}
html[data-style=bits]{--px:#000}
html[data-style=bits][data-theme=papel]{--px:#1e1e1c}
html[data-style=bits] *{border-radius:0!important}
html[data-style=bits] .board{box-shadow:0 0 0 4px var(--px),0 0 0 8px var(--line2),8px 8px 0 8px var(--px)}
html[data-style=bits] .pc{filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35))}
html[data-style=bits] .evalbar{box-shadow:0 0 0 3px var(--px)}
html[data-style=bits] .side{background:var(--raise);padding:18px 18px 22px;border:3px solid var(--px);box-shadow:6px 6px 0 var(--px)}
html[data-style=bits] .btn{border:3px solid var(--px);background:var(--line);box-shadow:4px 4px 0 var(--px);font-weight:600;transition:none}
html[data-style=bits] .btn:hover:not(:disabled){background:var(--line2)}
html[data-style=bits] .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--px)}
html[data-style=bits] .btn.primary{background:var(--warn);color:#1a1c2c;border-color:var(--px)}
html[data-style=bits] .seg{border:3px solid var(--px);background:var(--bg);padding:2px;gap:2px}
html[data-style=bits] .seg button{border:0;padding:6px 10px;margin:0}
html[data-style=bits] .seg button[aria-pressed=true]{background:var(--warn);color:#1a1c2c}
html[data-style=bits] .stairs,html[data-style=bits] .list,html[data-style=bits] .games,html[data-style=bits] .moments,html[data-style=bits] .stats{border-top:0}
html[data-style=bits] .stair,html[data-style=bits] .item,html[data-style=bits] .game,html[data-style=bits] .moment{border:2px solid var(--px);background:var(--bg);margin-bottom:6px;box-shadow:3px 3px 0 var(--px);padding-left:12px;padding-right:12px}
html[data-style=bits] .stair.sel{background:var(--line);box-shadow:inset 4px 0 0 var(--warn),3px 3px 0 var(--px)}
html[data-style=bits] .clock .tm{border:3px solid var(--px);box-shadow:3px 3px 0 var(--px)}
html[data-style=bits] .clock.on .tm{background:var(--warn);color:#1a1c2c}
html[data-style=bits] input[type=text],html[data-style=bits] input[type=password],html[data-style=bits] select,html[data-style=bits] textarea{border:3px solid var(--px);background:var(--bg)}
html[data-style=bits] .moves{border:2px solid var(--px);background:var(--bg)}
html[data-style=bits] .result,html[data-style=bits] .tip,html[data-style=bits] .msg{background:var(--bg)}
html[data-style=bits] .opt{border:3px solid var(--line2)}
html[data-style=bits] .opt[aria-checked=true]{border-color:var(--warn);box-shadow:none}
html[data-style=bits] .tab[aria-selected=true]{border-bottom-width:4px}
html[data-style=bits] .promo button{border:3px solid var(--px);box-shadow:4px 4px 0 var(--px)}
html[data-style=bits] .bar,html[data-style=bits] .prog{height:8px;border:2px solid var(--px)}
html[data-style=bits] .egraph{border:3px solid var(--px)}
@media (max-width:1000px){ html[data-style=bits] .side{padding:14px 12px 18px} html[data-style=bits] .board{box-shadow:0 0 0 3px var(--px),0 0 0 6px var(--line2)} }

/* ---- Móvil ---- */
.tip{display:none}
@media (max-width:1000px){
  :root, html.clocked{--bw:min(calc(100vw - 32px), 560px)}
  html.barOn{--bw:min(calc(100vw - 60px), 532px)}
  main{padding:12px 16px 32px;gap:22px}
  .stage{width:100%;display:flex;flex-direction:column;align-items:center}
  .board-row{justify-content:center}
  .evalbar.off{display:none}
  .clock{width:100%;margin-left:0}
  html.barOn .clock{width:calc(var(--bw) + 28px)}
  #clockTop{margin-bottom:6px}
  .under{width:100%;max-width:none;margin-top:12px}
  .controls{gap:6px}
  .controls .btn{flex:1 1 auto;min-height:42px}
  .btn{min-height:40px}
  .btn.small{min-height:36px;padding:7px 12px}
  .seg{gap:16px}
  .seg button{padding:9px 0}
  .stair{padding:9px 8px}
  .game{padding:11px 6px}
  input[type=text],input[type=password],select,textarea{font-size:16px}
  .tip{display:block;font-size:14px;padding:8px 10px;border-left:2px solid var(--warn);background:var(--raise);border-radius:0 4px 4px 0}
  .tip[hidden]{display:none}
  .drawer{height:min(60dvh,60vh);padding-bottom:calc(32px + env(safe-area-inset-bottom))}
  .moves .m{padding:9px 8px}
  .moves{max-height:260px}
  .moment summary{padding:6px 0}
  .mvwrap{display:none}
  footer{padding-bottom:calc(26px + env(safe-area-inset-bottom))}
}
@media (max-width:380px){
  .top{padding:0 12px}
  main{padding:10px 12px 28px}
  :root, html.clocked{--bw:min(calc(100vw - 24px), 560px)}
  html.barOn{--bw:min(calc(100vw - 52px), 532px)}
  .sync{font-size:0;gap:0;margin-left:10px}
  .pill #pillText{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
  h2{font-size:22px}
}

// score UCI (perspectiva de quien mueve) -> entero; mate N => ±(1500-N)
function cpEq(score){
  if(!score) return 0;
  if(score.mated) return -1500;
  if(score.mate !== undefined){ return score.mate > 0 ? 1500 - score.mate : (score.mate < 0 ? -1500 - score.mate : -1500); }
  return Math.max(-1400, Math.min(1400, score.cp));
}
function fmtEval(v){
  if(Math.abs(v) >= 1500) return v > 0 ? '1-0' : '0-1';
  if(Math.abs(v) >= 1450){ const n = 1500 - Math.abs(v); return (v < 0 ? '-' : '') + 'M' + n; }
  const x = v / 100; if(Math.abs(x) < .05) return '0.0'; return (x > 0 ? '+' : '') + x.toFixed(1);
}

function pvToSan(fen, pv, n=8){ const g=new Chess(fen); const out=[]; for(const u of (pv||[]).slice(0,n)){ const m=g.move(uciObj(u)); if(!m) break; out.push(m.san); } return out; }
function uciToSan(fen, u){ const s=pvToSan(fen,[u],1); return s[0] || u; }
function material(fen){ const pos=fen.split(' ')[0]; const r={w:0,b:0,wq:0,bq:0,np:0}; for(const ch of pos){ const l=ch.toLowerCase(); if(VAL[l]===undefined) continue; const c=ch===l?'b':'w'; r[c]+=VAL[l]; if(l==='q') r[c+'q']++; if(l!=='p'&&l!=='k') r.np+=VAL[l]; } return r; }
function matDiff(fen, color){ const m=material(fen); return color==='w' ? m.w-m.b : m.b-m.w; }
function phaseOf(fen, ply){ if(ply < 20) return 'Apertura'; const m=material(fen); if(m.np <= 13 || (m.wq+m.bq===0 && m.np <= 26)) return 'Final'; return 'Medio juego'; }

function parsePGN(pgn){
  let s = String(pgn || '').replace(/\r/g,'');
  const headers = {};
  s = s.replace(/^\s*\[(\w+)\s+"((?:[^"\\]|\\.)*)"\]\s*$/gm, (m,k,v) => { headers[k]=v; return ''; });
  s = s.replace(/\{[^}]*\}/g,' ').replace(/;[^\n]*/g,' ');
  let prev; do { prev = s; s = s.replace(/\([^()]*\)/g,' '); } while(prev !== s);
  s = s.replace(/\$\d+/g,' ').replace(/\d+\.(\.\.)?/g,' ');
  const toks = s.split(/\s+/).filter(t => t && !/^(1-0|0-1|1\/2-1\/2|\*)$/.test(t))
    .map(t => t.replace(/[!?]+$/,'').replace(/^0-0-0/,'O-O-O').replace(/^0-0/,'O-O'));
  return {headers, toks};
}
function buildGame(pgn){
  const {headers, toks} = parsePGN(pgn);
  const start = headers.FEN || START_FEN;
  const g = new Chess(start);
  const fens = [g.fen()], moves = [];
  for(const t of toks){ const m = g.move(t, {sloppy:true}); if(!m) break; moves.push(m); fens.push(g.fen()); }
  return {headers, start, fens, moves};
}
function openingName(rec){
  let url = rec.eco || '';
  if(!url){ const m = /\[ECOUrl "([^"]+)"\]/.exec(rec.pgn||''); if(m) url = m[1]; }
  if(!url) return 'Apertura desconocida';
  const slug = url.split('/').pop() || '';
  const parts = []; for(const p of slug.split('-')){ if(/^\d+\./.test(p) || /^\d+$/.test(p)) break; parts.push(p); }
  return parts.join(' ').replace(/\.\.\./g,'') || 'Apertura desconocida';
}

/* =========================================================
   Motor Stockfish (Web Worker desde Blob, funciona en file://)
   ========================================================= */
function workerFromCode(code){ return new Worker(URL.createObjectURL(new Blob([code], {type:'text/javascript'}))); }
function handshake(w, ms){
  return new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error('timeout')), ms);
    w.onmessage = e => { if(String(e.data).startsWith('uciok')){ clearTimeout(to); res(w); } };
    w.onerror = ev => { clearTimeout(to); rej(ev); };
    w.postMessage('uci');
  });
}
async function createSF(){
  const wasm = typeof WebAssembly === 'object' && WebAssembly.validate(Uint8Array.of(0,97,115,109,1,0,0,0));
  if(wasm){
    let w;
    try{
      const r = await fetch(SF_BASE + 'stockfish.wasm.js');
      if(!r.ok) throw new Error('http');
      let code = await r.text();
      const needle = 'locateFile:function(e){return e}';
      if(!code.includes(needle)) throw new Error('patch');
      code = code.replace(needle, 'locateFile:function(e){return ' + JSON.stringify(SF_BASE) + '+e}');
      w = workerFromCode(code);
      await handshake(w, 15000);
      return {w, flavor:'WASM'};
    }catch(e){ console.warn('Stockfish WASM no disponible, uso asm.js', e); if(w) w.terminate(); }
  }
  const w = workerFromCode('importScripts(' + JSON.stringify(SF_BASE + 'stockfish.js') + ');');
  await handshake(w, 40000);
  return {w, flavor:'asm.js'};
}
function parseInfo(l){
  const t = l.split(' '); const r = {multipv:1, depth:0, score:null, pv:[], bound:false};
  for(let i=0;i<t.length;i++){
    const k = t[i];
    if(k==='depth') r.depth = +t[++i];
    else if(k==='multipv') r.multipv = +t[++i];
    else if(k==='score'){ const ty=t[++i], v=+t[++i]; r.score = ty==='mate' ? {mate:v} : {cp:v}; if(t[i+1]==='lowerbound'||t[i+1]==='upperbound') r.bound = true; }
    else if(k==='pv'){ r.pv = t.slice(i+1); break; }
  }
  return r.score ? r : null;
}
const Engine = {
  w:null, ready:false, flavor:'', q:[], cur:null, opt:{}, needNew:false, waiters:[],
  async init(){
    try{ const r = await createSF(); this.w = r.w; this.flavor = r.flavor; }
    catch(e){ console.error(e); this.failed = true; setPill('err','Stockfish no cargó: revisa tu conexión'); this.waiters.forEach(f=>f(false)); this.waiters = []; return; }
    this.w.onmessage = e => this._line(String(e.data));
    this.w.onerror = e => console.error('worker', e);
    this._send('setoption name Hash value 32');
    this.ready = true;
    setPill('ok', 'Stockfish 10 listo (' + this.flavor + ')');
    this.waiters.forEach(f=>f(true)); this.waiters = [];
    this._next();
  },
  failed:false,
  whenReady(){ if(this.ready) return Promise.resolve(true); if(this.failed) return Promise.resolve(false); return new Promise(r => this.waiters.push(r)); },
  _send(c){ this.w.postMessage(c); },
  run(fen, o={}){
    return new Promise(resolve => {
      const job = {fen, o, resolve, info:{}, tag:o.tag || 'ui', pr:o.priority === true ? 1 : (o.priority || 0)};
      let i = this.q.findIndex(j => j.pr < job.pr); if(i < 0) i = this.q.length;
      this.q.splice(i, 0, job);
      this._next();
    });
  },
  cancel(tag){
    this.q = this.q.filter(j => { if(!tag || j.tag === tag){ j.resolve(null); return false; } return true; });
    if(this.cur && (!tag || this.cur.tag === tag) && !this.cur.cancelled){ this.cur.cancelled = true; this._send('stop'); }
  },
  _setOpt(name, val){ if(this.opt[name] !== val){ this._send('setoption name ' + name + ' value ' + val); this.opt[name] = val; } },
  _next(){
    if(!this.ready || this.cur || !this.q.length) return;
    const j = this.q.shift(); this.cur = j; const o = j.o;
    this._setOpt('Skill Level', o.skill ?? 20);
    this._setOpt('MultiPV', o.multipv || 1);
    if(this.needNew && j.tag === 'ui'){ this._send('ucinewgame'); this.needNew = false; }
    this._send('position fen ' + j.fen);
    let go = 'go';
    if(o.depth) go += ' depth ' + o.depth;
    if(o.movetime) go += ' movetime ' + o.movetime;
    if(go === 'go') go += ' movetime 500';
    this._send(go);
  },
  _line(l){
    const j = this.cur; if(!j) return;
    if(l.startsWith('info ') && l.includes(' score ') && l.includes(' pv ')){
      const p = parseInfo(l);
      if(p && !p.bound){ j.info[p.multipv] = p; if(j.o.onInfo && !j.cancelled) j.o.onInfo(j.info, p); }
    } else if(l.startsWith('bestmove')){
      const best = l.split(' ')[1];
      this.cur = null;
      const top = j.info[1] || null;
      j.resolve(j.cancelled ? null : {best: (best && best !== '(none)') ? best : null, score: top ? top.score : null, pv: top ? top.pv : [], depth: top ? top.depth : 0, lines: j.info});
      this._next();
    }
  }
};

const Board = {
  cells:[], orient:'w', movable:null, sel:null, last:null, arrows:[], marks:{}, drag:null, onMove:null, onTap:null,
  init(){
    const root = $('#board');
    for(let i=0;i<64;i++){ const d=document.createElement('div'); d.className='sq'; root.appendChild(d); }
    this.cells = $$('.sq', root);
    this.layout();
    root.addEventListener('pointerdown', e => this._down(e));
    window.addEventListener('pointermove', e => this._move(e));
    window.addEventListener('pointerup', e => this._up(e));
    window.addEventListener('pointercancel', () => this._endDrag());
  },
  layout(){
    this.cells.forEach((c,i) => {
      const r = Math.floor(i/8), f = i%8;
      const file = this.orient==='w' ? f : 7-f, rank = this.orient==='w' ? 7-r : r;
      c.dataset.sq = 'abcdefgh'[file] + (rank+1);
    });
  },
  flip(){ this.orient = other(this.orient); this.layout(); this.render(); EvalBar.refresh(); },
  canMove(color){
    const g = App.game; if(App.busy || g.game_over()) return false;
    if(color !== g.turn()) return false;
    return this.movable === 'both' || this.movable === color;
  },
  targets(){ return this.sel ? App.game.moves({square:this.sel, verbose:true}) : []; },
  isTarget(sq){ return this.targets().some(m => m.to === sq); },
  render(){
    const g = App.game, bd = g.board();
    const tset = {}; this.targets().forEach(m => tset[m.to] = (m.captured ? 'cap' : 'dot'));
    let chk = null;
    if(g.in_check()){ const t=g.turn(); for(let r=0;r<8;r++) for(let f=0;f<8;f++){ const p=bd[r][f]; if(p && p.type==='k' && p.color===t) chk='abcdefgh'[f]+(8-r); } }
    for(const c of this.cells){
      const sq = c.dataset.sq, f = 'abcdefgh'.indexOf(sq[0]), rk = +sq[1];
      const p = bd[8-rk][f];
      let cls = 'sq ' + ((f + rk - 1) % 2 ? 'l' : 'd');
      if(this.last && (this.last.from===sq || this.last.to===sq)) cls += ' last';
      if(this.sel === sq) cls += ' sel';
      if(chk === sq) cls += ' chk';
      if(this.marks[sq]) cls += ' mk-' + this.marks[sq];

  xy(sq){ const f='abcdefgh'.indexOf(sq[0]), r=+sq[1]-1; return this.orient==='w' ? [f+.5, 7-r+.5] : [7-f+.5, r+.5]; },
  drawArrows(){

  _down(e){

  _up(e){

  _endDrag(){ if(this.drag && this.drag.ghost) this.drag.ghost.remove(); this.drag = null; },
  async _try(from, to){

  pickPromo(color){

      box.innerHTML = ['q','r','b','n'].map(t => '<button data-p="'+t+'" aria-label="Coronar"><span class="pc p'+color+t+'"></span></button>').join('');

};

const TIME_CONTROLS = [['none','Sin reloj'],['180+2','3+2'],['300+0','5+0'],['600+5','10+5'],['900+10','15+10'],['1800+20','30+20']];
function parseTC(v){ if(!v || v === 'none') return null; const [b,i] = String(v).split('+').map(Number); return {base:b*1000, inc:(i||0)*1000}; }
function tcLabel(v){ const t = TIME_CONTROLS.find(x => x[0] === v); return t ? t[1] : 'Sin reloj'; }
function fmtClock(ms){ ms = Math.max(0, ms); if(ms < 10000) return (Math.floor(ms/100)/10).toFixed(1); const s = Math.ceil(ms/1000); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function canMate(fen, color){
  // ¿Tiene "color" material para dar mate con alguna secuencia legal?
  const pos = fen.split(' ')[0]; let minors = 0, heavy = 0, oppOther = 0;
  for(const ch of pos){ const l = ch.toLowerCase(); if(!'pnbrq'.includes(l)) continue; const c = ch === l ? 'b' : 'w';
    if(c === color){ if(l === 'n' || l === 'b') minors++; else heavy++; } else oppOther++; }
  if(heavy || minors >= 2) return true;
  return minors === 1 && oppOther > 0;
}
class GameClock{
  constructor(tc, onFlag, onTick){ this.tc = tc; this.t = {w:tc.base, b:tc.base}; this.side = null; this.paused = null; this.t0 = 0; this.onFlag = onFlag; this.onTick = onTick; this.iv = null; }
  elapsed(){ return this.side ? performance.now() - this.t0 : 0; }
  left(c){ return this.t[c] - (this.side === c ? this.elapsed() : 0); }
  start(c){ this.side = c; this.t0 = performance.now(); if(!this.iv) this.iv = setInterval(() => this.tick(), 100); this.tick(); }
  pause(){ if(!this.side) return; this.t[this.side] -= this.elapsed(); this.paused = this.side; this.side = null; this.tick(); }
  resume(){ if(this.paused){ const c = this.paused; this.paused = null; this.start(c); } }
  moved(c){ if(this.side === c) this.t[c] -= this.elapsed(); this.paused = null; this.t[c] += this.tc.inc; this.start(other(c)); }
  stop(){ if(this.side){ this.t[this.side] -= this.elapsed(); this.side = null; } clearInterval(this.iv); this.iv = null; this.onTick && this.onTick(); }
  tick(){
    const c = this.side;
    if(c && this.left(c) <= 0){ this.t[c] = 0; this.side = null; clearInterval(this.iv); this.iv = null; this.onTick && this.onTick(); this.onFlag(c); return; }
    this.onTick && this.onTick();
  }
}

const TIER_ELO = [600, 900, 1200, 1500, 1800, 2100, 2400, 2700];
function cfgForElo(e){
  e = Math.max(400, Math.min(2800, e));
  if(e <= TIER_ELO[0]){ const t = TIERS[0]; return {skill:0, depth:1, movetime:t.movetime, rnd:Math.min(.55, t.rnd + (TIER_ELO[0] - e) / 800)}; }
  if(e >= TIER_ELO[7]) return Object.assign({}, TIERS[7]);
  let k = 0; while(e > TIER_ELO[k+1]) k++;
  const a = TIERS[k], b = TIERS[k+1], t = (e - TIER_ELO[k]) / (TIER_ELO[k+1] - TIER_ELO[k]);
  const lerp = (x, y) => x + (y - x) * t;
  return {skill:Math.round(lerp(a.skill, b.skill)), depth:b.depth === null ? (t > .5 ? null : a.depth + 3) : Math.round(lerp(a.depth, b.depth)), movetime:Math.round(lerp(a.movetime, b.movetime)), rnd:lerp(a.rnd, b.rnd)};
}
function coachState(){
  if(!S.coach) S.coach = {rating:null, rec:{w:0,d:0,l:0}, serious:0, games:[]};
  return S.coach;
}
function bandOf(e){ return e < 1000 ? 'inicial' : e < 1600 ? 'intermedio' : e < 2000 ? 'avanzado' : 'experto'; }
const BAND_NAME = {inicial:'inicial', intermedio:'intermedio', avanzado:'avanzado', experto:'experto'};
function playerModel(){
  const me = S.username.toLowerCase(), out = {sources:[]};
  let sum = 0, w = 0;
  const recent = S.games.filter(g => g.tc !== 'daily').slice(0, 30).map(g => g.white.toLowerCase() === me ? g.wr : g.br).filter(x => x > 0);
  if(recent.length >= 3){ const avg = recent.reduce((a,b) => a+b, 0) / recent.length; sum += avg * 3; w += 3; out.sources.push('tus partidas de Chess.com (' + Math.round(avg) + ')'); }
  if(S.ladder.unlocked > 1){ const e = TIER_ELO[S.ladder.unlocked - 2]; sum += e * 1.5; w += 1.5; out.sources.push('la escalera (' + e + ')'); }
  if(S.puzzles.hist.length >= 10){ const e = S.puzzles.rating - 250; sum += e; w += 1; out.sources.push('tus puzzles (' + S.puzzles.rating + ')'); }
  const C = coachState();
  if(C.serious >= 3 && C.rating !== null){ sum += C.rating * 3; w += 3; out.sources.push('tus partidas serias con el maestro (' + C.rating + ')'); }
  out.elo = w ? Math.round(sum / w) : 1000;
  out.band = bandOf(out.elo);
  const p = errorProfile(); out.top = p.ranked.slice(0, 2).map(x => x[0]); out.total = p.total; out.phases = p.phases; out.games = p.games;
  out.endShare = p.total ? Math.round(100 * (p.phases['Final'] || 0) / p.total) : 0;
  return out;
}
let _tree = null, _treeKey = '';
function posKey(fen){ return fen.split(' ').slice(0, 4).join(' '); }
function openingTree(){
  const key = S.username + ':' + S.games.length;
  if(_tree && _treeKey === key) return _tree;
  const me = S.username.toLowerCase(), tree = {};
  for(const g of S.games){
    if(!g.pgn) continue;
    const uc = g.white.toLowerCase() === me ? 'w' : 'b';
    const {headers, toks} = parsePGN(g.pgn); if(headers.FEN) continue;
    const c = new Chess();
    for(const t of toks.slice(0, 16)){
      const k = posKey(c.fen()), turn = c.turn();
      const m = c.move(t, {sloppy:true}); if(!m) break;
      const node = tree[k] || (tree[k] = {opp:{}, me:{}});
      const side = turn === uc ? node.me : node.opp;
      side[m.san] = (side[m.san] || 0) + 1;
    }
  }
  _tree = tree; _treeKey = key; return tree;
}
function bookLineMove(hist){
  // Siguiente jugada de una línea de OPENINGS que coincida con la partida
  const fits = OPENINGS.filter(o => { const l = o.line.split(' '); return l.length > hist.length && hist.every((m,i) => m.replace(/[+#]/g,'') === l[i].replace(/[+#]/g,'')); });
  if(!fits.length) return null;
  const o = fits[Math.floor(Math.random() * fits.length)];
  return {san:o.line.split(' ')[hist.length], name:o.t};
}
function openingNow(hist){
  if(hist.length < 4) return null;
  const o = OPENINGS.find(o => { const l = o.line.split(' '); return hist.length <= l.length && hist.every((m,i) => m.replace(/[+#]/g,'') === l[i].replace(/[+#]/g,'')); });
  return o ? o.t : null;
}
function threatScan(fen, user){
  // Capturas que el rival podría hacer si le tocara mover y que ganan material
  const parts = fen.split(' '); parts[1] = other(user); parts[3] = '-';
  const f = parts.join(' '); if(!new Chess().validate_fen(f).valid) return null;
  const g = new Chess(f); let best = null;
  for(const m of g.moves({verbose:true})){
    if(!m.captured || m.captured === 'p') continue;
    const t = new Chess(f); t.move(m);
    const defended = t.moves({verbose:true}).some(x => x.to === m.to && x.captured);
    const gain = defended ? VAL[m.captured] - VAL[m.piece] : VAL[m.captured];
    if(gain >= 2 && (!best || gain > best.gain)) best = {gain, piece:m.piece, target:m.captured, sq:m.to, from:m.from};
  }
  return best;
}
function moveLabel(fen, san){ const p = fen.split(' '); return (+p[5] || 1) + (p[1] === 'w' ? '. ' : '... ') + san; }

class Coach{

    $$('[data-act]', box).forEach(b => b.onclick = () => { const id = b.closest('.msg').dataset.id; const m = this.msgs.find(x => x.id === id); if(!m || m.done) return; m.done = true; this.renderFeed(); m.actions[+b.dataset.act].on(); });

  }
  start(){
    const p = this.prof;
    if(this.vs){
      const top = p.top.length ? ' Tu error más común es ' + p.top[0].toLowerCase() + '; voy a estar atento a eso.' : '';
      this.say('info', 'Por ' + (p.sources.length ? p.sources.join(', ') : 'falta de datos') + ', te estimo en unos ' + p.elo + ' puntos (nivel ' + BAND_NAME[p.band] + '). Voy a jugar a unos ' + this.ses.o.coachElo + '.' + top +
        (this.tree && Object.keys(this.tree).length ? ' En la apertura te pondré las líneas que más te juegan tus rivales.' : ''));
    } else {
      this.say('info', this.guide ? 'Te acompaño en esta partida. Comento los momentos clave y te aviso antes de un error grave.' : 'Te acompaño en esta partida. Durante el juego solo señalo lo bueno; tus errores los repasamos al final.');
    }
    if(this.quiz) this.say('info', 'Partida de amenazas: antes de varias de tus jugadas te preguntaré qué amenaza tu rival. Toca tu pieza en peligro, o tu rey si hay mate. A veces no habrá nada, y decirlo también cuenta. Revisar jaques, capturas y amenazas antes de mover es el hábito que más puntos da por debajo de 1500.', {label:'Cómo funciona'});
  }
  userTurn(){
    const fen = App.game.fen();
    if(this.pre && this.pre.fen === fen) return;
    const pre = {fen, r:null};
    pre.p = Engine.run(fen, {movetime:650, multipv:2, tag:'coach', priority:2}).then(r => { pre.r = r; return r; });
    this.pre = pre;
  }
  onUndo(){ this.pre = null; this.lastThreat = null; }
  // Revisión de amenazas: antes de la jugada del usuario, preguntar qué amenaza el rival
  askThreat(){
    const ses = this.ses, g = App.game;
    if(!this.quiz || ses.over || ses.pendingQuiz || g.game_over() || g.in_check() || g.turn() !== this.user) return false;
    const T = threatsFor(g.fen(), this.user); if(!T) return false;
    const real = T.caps.length > 0 || !!T.mate;
    // Sin amenaza también se pregunta a veces, para que la pregunta no delate que hay algo
    if(!real && (g.history().length < 6 || Math.random() > .35)) return false;
    const kingSq = kingSquare(g.fen(), this.user);
    const targets = new Set(T.caps.map(c => c.sq)), attackers = new Set(T.caps.map(c => c.from));
    if(T.mate){ targets.add(kingSq); attackers.add(T.mate.from); }
    ses.pendingQuiz = {T, real, targets, attackers, kingSq, fen:g.fen()};
    Board.movable = null; Board.sel = null; Board.onTap = sq => this.answerThreat(sq); Board.render();
    this.say('info', 'Revisa sus jaques, capturas y amenazas. Si no ves nada, pulsa Nada directo.', {label:'Antes de tu jugada'});
    ses.update(); revealBoard();
    return true;
  }
  threatText(q){
    const T = q.T, g = new Chess(q.fen);
    if(T.mate){ const pc = g.get(T.mate.from); return {text:'su ' + PNAME[pc.type] + ' de ' + T.mate.from + ' te da mate con ' + T.mate.san, from:T.mate.from, to:T.mate.to, mark:q.kingSq}; }
    const c = T.caps[0]; if(!c) return null;
    return {text:'su ' + PNAME[c.piece] + ' de ' + c.from + ' gana tu ' + PNAME[c.target] + ' de ' + c.sq, from:c.from, to:c.sq, mark:c.sq};
  }
  answerThreat(sq){
    const ses = this.ses, q = ses.pendingQuiz; if(!q || ses.over) return;
    if(sq !== null && !new Chess(q.fen).get(sq)){ toast('Toca una pieza, o pulsa Nada directo.'); return; }
    const ok = q.real ? (sq !== null && (q.targets.has(sq) || q.attackers.has(sq))) : sq === null;
    const main = this.threatText(q), extra = q.T.caps.length > 1 && !q.T.mate ? ' También vigila ' + q.T.caps.slice(1, 3).map(c => 'tu ' + PNAME[c.target] + ' de ' + c.sq).join(' y ') + '.' : '';
    if(q.real){ this.qa.real++; if(ok) this.qa.spotted++; } else { this.qa.calm++; if(ok) this.qa.calmOk++; }
    let text;
    if(q.real && ok) text = 'Bien visto: ' + main.text + '. Elige tu jugada pensando en eso.' + extra;
    else if(q.real) text = (sq === null ? 'Sí había algo: ' : 'No es eso. La amenaza es: ') + main.text + '.' + extra;
    else if(ok) text = 'Correcto: no hay amenaza directa. Puedes jugar tu plan.';
    else text = 'No había amenaza directa sobre esa pieza. Revisa jaques, capturas y amenazas, pero no te defiendas de algo que no existe.';
    const H = S.threats || (S.threats = {hist:[]}); if(!H.hist) H.hist = [];
    H.hist.push({t:Date.now(), ok, k:q.T.mate ? 'mate' : q.real ? 'cap' : 'none'}); if(H.hist.length > 300) H.hist = H.hist.slice(-300);
    save();
    ses.pendingQuiz = null; Board.onTap = null; Board.movable = this.user;
    Board.arrows = main ? [{from:main.from, to:main.to, c:'r'}] : []; Board.marks = {};
    if(main) Board.marks[main.mark] = ok ? 'good' : 'bad'; else if(sq) Board.marks[sq] = 'bad';
    this.say(ok ? 'good' : 'bad', text, {label:'Revisión de amenazas', facts:{momento:'pregunta del maestro: qué amenaza el rival', acierto:ok, amenaza:main ? main.text : 'ninguna directa'}});
    ses.update();
  }
  async getPre(fen){
    if(this.pre && this.pre.fen === fen) return this.pre.r || await this.pre.p;
    this.pre = null; this.userTurn(); return await this.pre.p;
  }
  async analyzeMove(fenBefore, m){
    const pre = await this.getPre(fenBefore); if(!pre || !pre.best) return null;
    const before = cpEq(pre.score), uci = moveUci(m);
    const g = new Chess(fenBefore); g.move({from:m.from, to:m.to, promotion:m.promotion});
    let after, refPv;
    if(pre.best === uci){ after = before; refPv = (pre.pv || []).slice(1); }
    else if(g.in_checkmate()){ after = 1500; refPv = []; }
    else if(g.game_over()){ after = 0; refPv = []; }
    else { const r = await Engine.run(g.fen(), {movetime:500, tag:'coach', priority:2}); if(!r) return null; after = -cpEq(r.score); refPv = r.pv || []; }
    const l2 = pre.lines && pre.lines[2];
    const second = l2 ? cpEq(l2.score) : null;
    const drop = pre.best === uci ? 0 : Math.max(0, winPct(before) - winPct(after));
    const fp = fenBefore.split(' ');
    return {fen:fenBefore, ply:((+fp[5] || 1) - 1) * 2 + (fp[1] === 'b' ? 1 : 0), uci, san:m.san, piece:m.piece, before, after, drop, best:pre.best, bestSan:uciToSan(fenBefore, pre.best), bestPv:(pre.pv || []).slice(1), refPv, second, isBest:pre.best === uci};
  }
  warnThreshold(){ return {inicial:20, intermedio:22, avanzado:25, experto:30}[this.band]; }
  async preCheck(fenBefore, m){
    const v = await this.analyzeMove(fenBefore, m); if(!v) return null;
    const key = fenBefore + v.uci;
    v.warn = v.drop >= this.warnThreshold() && v.before > -600 && !this.warned[key];
    if(v.warn) this.warned[key] = true;
    return v;
  }
  consequence(v){
    const uc = this.user; const gP = new Chess(v.fen); const played = gP.move(uciObj(v.uci));
    const line = applyLine(gP.fen(), v.refPv, 4); const r1 = line.moves[0];
    const loss = matDiff(v.fen, uc) - matDiff(line.fen, uc);
    if(v.after <= -1450) return {cat:'Permitió mate', text:'tu rival tiene mate' + (r1 ? ', empezando con ' + r1.san : '')};
    if(v.before >= 1450 && v.after < 1450) return {cat:'Mate no visto', text:'dejas escapar un mate que tenías'};
    if(r1 && r1.captured && r1.to === played.to && loss >= 2) return {cat:'Pieza colgada', text:'tu ' + PNAME[played.piece] + ' queda sin defensa en ' + played.to + ' y tu rival ' + pro(played.piece) + ' captura con ' + r1.san};
    if(r1 && r1.captured && loss >= 2) return {cat:'Pieza colgada', text:'tu rival captura con ' + r1.san + ' y pierdes ' + matPhrase(loss)};
    if(r1 && loss >= 2) return {cat:'Táctica no vista', text:'tu rival responde ' + r1.san + ' y gana ' + matPhrase(loss)};
    const bl = applyLine(v.fen, [v.best].concat(v.bestPv), 4); const gain = matDiff(bl.fen, uc) - matDiff(v.fen, uc);
    if(gain >= 2) return {cat:'Táctica no vista', text:'te pierdes ' + v.bestSan + ', que ganaba ' + matPhrase(gain)};
    return {cat:'Error posicional', text:'tu posición empeora: ' + evalWords(v.after).replace('ibas','quedas').replace('la posición estaba','la posición queda')};
  }
  tip(cat){
    const basic = {'Pieza colgada':'Antes de mover, mira qué piezas tuyas quedan sin defensa.', 'Permitió mate':'Revisa los jaques que tiene tu rival y las casillas de escape de tu rey.', 'Mate no visto':'Con el rey rival expuesto, revisa primero todos los jaques.', 'Táctica no vista':'Busca jaques, capturas y amenazas antes que jugadas tranquilas.', 'Error posicional':'Pregúntate qué quiere hacer tu rival con su próxima jugada.'};
    return this.band === 'inicial' || this.band === 'intermedio' ? basic[cat] || '' : '';
  }
  lineText(fen, first, pv){
    const n = {inicial:2, intermedio:4, avanzado:6, experto:8}[this.band];
    const g = new Chess(fen); const m = g.move(uciObj(first)); if(!m) return '';
    return numberedLine(fen, [m.san].concat(pvToSan(g.fen(), pv, n)));
  }
  warn(v, commit){
    const c = this.consequence(v), ses = this.ses;
    const text = 'Espera. Si juegas ' + v.san + ', ' + c.text + '. ' + (this.tip(c.cat) || '¿Seguro?');
    let msg = null;
    const think = () => { ses.pendingWarn = null; if(msg) msg.done = true; this.renderFeed(); ses.update(); };
    const play = () => { ses.pendingWarn = null; if(msg) msg.done = true; this.renderFeed(); v.forced = true; commit(); };
    ses.pendingWarn = {text, think, play};
    msg = this.say('warn', text, {
      label:'Aviso antes de ' + moveLabel(v.fen, v.san),
      facts:{momento:'aviso antes de un error grave', jugada:v.san, consecuencia:c.text, categoria:c.cat, eval_antes:fmtEval(v.before), eval_despues:fmtEval(v.after), linea_si_la_juega:this.lineText(v.fen, v.uci, v.refPv)},
      actions:[{label:'Pensar otra vez', on:think}, {label:'Jugarla igual', on:play}]
    });
  }
  afterUser(m, fenBefore, verdict){
    this.msgs.forEach(x => { if(x.actions) x.done = true; }); this.renderFeed();
    this.pending = this.pending.then(async () => {
      const tok = App.token;
      const v = verdict || await this.analyzeMove(fenBefore, m).catch(e => { console.warn(e); return null; });
      if(!v || tok !== App.token) return;
      this.moveEvals.push(v);
      const label = moveLabel(v.fen, v.san), uc = this.user;
      if(v.drop >= 20){
        const c = this.consequence(v); v.cat = c.cat;
        if(this.guide){
          this.say('bad', (v.forced ? 'La jugaste igual: ' + c.text : c.text.charAt(0).toUpperCase() + c.text.slice(1)) + '. Era mejor ' + v.bestSan + '.', {label,
            line:this.lineText(v.fen, v.best, v.bestPv),
            facts:{momento:'error ya jugado', jugada:v.san, mejor:v.bestSan, consecuencia:c.text, categoria:c.cat, eval_antes:fmtEval(v.before), eval_despues:fmtEval(v.after), linea_mejor:this.lineText(v.fen, v.best, v.bestPv)}});
        } else this.deferred.push(v);
        return;
      }
      if(v.drop >= 10 && this.guide && this.band !== 'inicial'){ this.say('info', v.san + ' es jugable, pero ' + v.bestSan + ' era más preciso.', {label}); return; }
      if(v.isBest){
        const bl = applyLine(v.fen, [v.uci].concat(v.bestPv), 3); const gain = matDiff(bl.fen, uc) - matDiff(v.fen, uc);
        if(v.before >= 1450 && !this.said.mate){ this.said.mate = true; this.say('good', 'Exacto, ' + v.san + ' va camino al mate.', {label}); }
        else if(v.second !== null && winPct(v.before) - winPct(v.second) >= 20 && v.before > -400){ this.say('good', 'Muy bien: ' + v.san + ' era la única jugada que mantenía tu posición.', {label, facts:{momento:'encontró la única jugada buena', jugada:v.san, eval:fmtEval(v.before), segunda_mejor_eval:fmtEval(v.second)}}); }
        else if(gain >= 2){ this.say('good', 'Bien visto: ' + v.san + ' gana ' + matPhrase(gain) + '.', {label, facts:{momento:'táctica encontrada', jugada:v.san, ganancia:matPhrase(gain), linea:this.lineText(v.fen, v.uci, v.bestPv)}}); }
      }
    }).catch(e => console.warn('coach', e));
  }
  afterEngine(m, r){
    const g = App.game, hist = g.history();
    if(r.book && r.book.src === 'tree' && !this.said.tree){ this.said.tree = true; this.say('info', 'Te pongo ' + r.book.san + ': es lo que más te han jugado tus rivales en esta posición (' + r.book.n + ' de tus partidas).'); }
    if(this.said.tree && !r.book && !this.said.treeEnd){ this.said.treeEnd = true; this.say('info', 'Aquí se acaban las líneas de tus partidas. Desde ahora juego con el motor.'); }
    const op = openingNow(hist); if(op && !this.said['op' + op]){ this.said['op' + op] = true; this.say('info', 'Estamos en la ' + op + '.'); }
    if(!this.said.end && hist.length >= 20 && phaseOf(g.fen(), hist.length) === 'Final'){
      this.said.end = true;
      this.say('info', 'Entramos al final.' + (this.prof.endShare >= 30 ? ' El ' + this.prof.endShare + '% de tus errores analizados ocurren en finales: activa tu rey y cuenta los tiempos antes de cambiar piezas.' : ' Ahora el rey es una pieza de ataque: acércalo al centro.'));
    }
    if(this.guide && !g.game_over()){
      const t = threatScan(g.fen(), this.user);
      const key = t ? t.from + t.sq : null;
      if(t && key !== this.lastThreat) this.say('warn', 'Ojo: su ' + PNAME[t.piece] + ' de ' + t.from + ' amenaza tu ' + PNAME[t.target] + ' de ' + t.sq + '.', {label:'Después de ' + m.san});
      this.lastThreat = key;
    }
  }
  bookMove(){
    if(!this.vs) return null;
    const g = App.game, hist = g.history(); if(hist.length >= 16) return null;
    const node = this.tree && this.tree[posKey(g.fen())];
    if(node && Object.keys(node.opp).length){
      const ent = Object.entries(node.opp); const total = ent.reduce((a,[,n]) => a+n, 0);
      let x = Math.random() * total;
      for(const [san, n] of ent){ x -= n; if(x <= 0){ const mv = new Chess(g.fen()).move(san, {sloppy:true}); if(mv) return {uci:moveUci(mv), san, n, src:'tree'}; } }
    }
    if(this.said.treeEnd || hist.length >= 12) return null;
    const bl = bookLineMove(hist);
    if(bl){ const mv = new Chess(g.fen()).move(bl.san, {sloppy:true}); if(mv) return {uci:moveUci(mv), san:bl.san, src:'book'}; }
    return null;
  }
  finish(result){
    this.pending.then(() => this._finish(result)).catch(e => console.warn('coach', e));
  }
  _finish(result){
    if(this.finished) return; this.finished = true;
    const ev = this.moveEvals, n = ev.length, uc = this.user;
    const accs = ev.map(v => Math.max(0, Math.min(100, 103.1668 * Math.exp(-0.04354 * v.drop) - 3.1669)));
    const acc = n ? Math.round(accs.reduce((a,b) => a+b, 0) / n) : null;
    const bad = ev.filter(v => v.drop >= 20 && v.before > -600);
    bad.forEach(v => { if(!v.cat) v.cat = this.consequence(v).cat; });
    const cats = {}; bad.forEach(v => cats[v.cat] = (cats[v.cat] || 0) + 1);
    const worst = bad.slice().sort((a,b) => b.drop - a.drop)[0];
    let text = n >= 5 ? 'Precisión aproximada: ' + acc + '%. ' : '';
    text += bad.length ? 'Tuviste ' + bad.length + ' error' + (bad.length > 1 ? 'es' : '') + ' importante' + (bad.length > 1 ? 's' : '') + '. ' : (n >= 5 ? 'Sin errores importantes. ' : '');
    if(worst) text += 'El que más costó fue ' + moveLabel(worst.fen, worst.san) + ': ' + this.consequence(worst).text + '; la mejor era ' + worst.bestSan + '. ';
    const top = this.prof.top[0];
    if(top) text += cats[top] ? 'Volvió a aparecer tu patrón más común (' + top.toLowerCase() + '). ' : 'Hoy no apareció tu patrón más común (' + top.toLowerCase() + '): buena señal. ';
    if(this.quiz && (this.qa.real || this.qa.calm)) text += 'Amenazas: viste ' + this.qa.spotted + ' de ' + this.qa.real + (this.qa.calm ? ', y en ' + this.qa.calmOk + ' de ' + this.qa.calm + ' posiciones tranquilas no te asustaste de más' : '') + '. ';
    if(bad.length) text += 'Guardé estas posiciones en tus puzzles para repasarlas.';
    if(!this.guide) this.deferred.forEach(v => { const c = this.consequence(v); this.say('bad', c.text.charAt(0).toUpperCase() + c.text.slice(1) + '. Era mejor ' + v.bestSan + '.', {label:moveLabel(v.fen, v.san), line:this.lineText(v.fen, v.best, v.bestPv)}); });
    this.say('sum', text.trim() || 'Partida corta: no hay suficientes jugadas para un resumen.', {label:'Resumen',
      facts:{momento:'resumen final de la partida', resultado:result.res || (result.ok ? 'objetivo cumplido' : 'objetivo no cumplido'), motivo:result.why, precision:acc, errores:bad.map(v => ({jugada:moveLabel(v.fen, v.san), mejor:v.bestSan, tipo:v.cat, consecuencia:this.consequence(v).text})), patron_comun_del_jugador:top || null, amenazas:this.quiz ? {vistas:this.qa.spotted, reales:this.qa.real} : null}});
    // Aprender: guardar errores para puzzles y perfil
    const gid = this.ses.gid || ('coach:' + Date.now()), date = Math.floor(Date.now() / 1000), opp = this.ses.oppName;
    if((bad.length || n >= 4) && !(S.analyses[gid] && S.analyses[gid].deep)){
      const mistakes = bad.filter(v => v.best).map(v => ({id:gid + '#' + (v.ply+1), gid, ply:v.ply+1, fen:v.fen, played:v.san, playedUci:v.uci, best:v.best, bestSan:v.bestSan, drop:Math.round(v.drop), before:v.before, cat:v.cat, phase:phaseOf(v.fen, v.ply), date, opp, color:uc}));
      S.analyses[gid] = {v:1, src:'coach', acc:acc || 0, w:[], tags:{}, cnt:{inacc:ev.filter(v => v.drop >= 10 && v.drop < 20).length, mistake:ev.filter(v => v.drop >= 20 && v.drop < 30).length, blunder:ev.filter(v => v.drop >= 30).length}, mistakes};
    }
    const C = coachState(); C.games.unshift({t:Date.now(), vs:this.vs, res:result.res || null, acc, errors:bad.length}); C.games = C.games.slice(0, 200);
    save();
  }
}

/* ---------- Claude (opcional) ---------- */
const CLAUDE_MODELS = [['claude-haiku-5-5','Claude Haiku 5.5: rápido y económico'],['claude-sonnet-5-5','Claude Sonnet 5.5: explicaciones más finas']];
const ClaudeAI = {
  cfg(){ return Object.assign({on:false, key:'', model:'claude-haiku-5-5'}, S.settings.claude || {}); },
  ready(){ const c = this.cfg(); return !!(c.on && c.key); },
  // Haiku 5.5 y Sonnet 5.5 piensan por defecto y ese pensamiento cuenta dentro de max_tokens: con los límites
  // cortos de estos comentarios la respuesta podía quedar cortada o vacía. Se apaga el pensamiento previo.
  noThink:{'claude-haiku-5-5':{type:'disabled'}, 'claude-sonnet-5-5':{type:'between_tools'}},
  async ask(system, user, maxTokens){
    const c = this.cfg(), body = {model:c.model, max_tokens:maxTokens || 220, system, messages:[{role:'user', content:user}]};
    const nt = this.noThink[c.model]; if(nt) body.thinking = nt;
    const post = async () => {
      const r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST',
        headers:{'x-api-key':c.key, 'anthropic-version':'2023-06-01', 'content-type':'application/json', 'anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify(body)});
      return {r, d:await r.json().catch(() => ({}))};
    };
    let {r, d} = await post();
    const msg = () => (d.error && d.error.message) || ('HTTP ' + r.status);
    // Si el modelo no acepta ese ajuste, se reintenta sin él y con espacio para pensar y responder
    if(!r.ok && body.thinking && r.status === 400 && /thinking/i.test(msg())){ delete body.thinking; body.max_tokens = Math.max(2048, body.max_tokens * 8); ({r, d} = await post()); }
    if(!r.ok) throw new Error(msg());
    const txt = (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
    if(!txt) throw new Error(d.stop_reason === 'max_tokens' ? 'Claude se quedó sin espacio para responder.' : 'Claude respondió sin texto' + (d.stop_reason ? ' (' + d.stop_reason + ')' : '') + '.');
    return txt;
  },
  system(coach){
    const p = coach.prof;
    return 'Eres el Maestro de Casilla, un entrenador de ajedrez que acompaña a un jugador de nivel ' + p.band + ' (unos ' + p.elo + ' puntos ELO). ' +
      'Escribe en español de México, tuteando, en una a tres frases cortas, sin saludos, sin relleno y sin guiones largos. ' +
      'Usa solo los datos de Stockfish que te doy: no inventes jugadas, variantes ni evaluaciones. Escribe las jugadas tal como vienen, en notación algebraica. ' +
      'Adapta la explicación al nivel: para nivel inicial explica la idea básica en palabras simples; para niveles altos sé concreto con la línea. ' +
      (p.top.length ? 'Sus errores más comunes en sus partidas: ' + p.top.join(' y ').toLowerCase() + '.' : '');
  },
  queue:Promise.resolve(), lastError:null,
  enhance(coach, m){
    if(!this.ready()) return;
    m.aiPending = true; coach.renderFeed();
    const tok = App.token;
    this.queue = this.queue.then(async () => {
      if(tok !== App.token) return;
      try{
        const isSum = m.kind === 'sum';
        const txt = await this.ask(this.system(coach) + (isSum ? ' Para el resumen usa hasta cinco frases y termina con una recomendación concreta de entrenamiento.' : ''),
          'Momento de la partida: ' + m.facts.momento + '.\nDatos: ' + JSON.stringify(m.facts) + '\nComentario de referencia: ' + m.text + '\nEscribe tu comentario.', isSum ? 420 : 220);
        if(tok !== App.token) return;
        if(txt){ m.text = txt; m.ai = true; }
        this.lastError = null;
      }catch(e){ this.lastError = e.message; console.warn('Claude', e); }
      m.aiPending = false; coach.renderFeed();
    });
  }
};

/* ---------- Utilidades de posición ---------- */
function fenBoard(fen){ return fen.split(' ')[0].split('/').map(r => { const out = []; for(const ch of r){ if(/\d/.test(ch)) for(let k = 0; k < +ch; k++) out.push(null); else out.push(ch); } return out; }); }
function boardFen(b, rest){ return b.map(r => { let s = '', e = 0; for(const c of r){ if(!c){ e++; continue; } if(e){ s += e; e = 0; } s += c; } return s + (e ? e : ''); }).join('/') + ' ' + rest; }
function sqIdx(sq){ return [8 - +sq[1], 'abcdefgh'.indexOf(sq[0])]; }
function idxSq(r, f){ return 'abcdefgh'[f] + (8 - r); }
function asTurn(fen, color){ const p = fen.split(' '); p[1] = color; p[3] = '-'; const f = p.join(' '); return new Chess().validate_fen(f).valid ? f : null; }
function capturersOn(fen, sq, color){ const f = asTurn(fen, color); if(!f) return []; return new Chess(f).moves({verbose:true}).filter(m => m.to === sq && m.captured).map(m => ({from:m.from, piece:m.piece})); }
function defendersOf(fen, sq){
  const pc = new Chess(fen).get(sq); if(!pc || pc.type === 'k') return [];
  const b = fenBoard(fen), [r, f] = sqIdx(sq), enemy = other(pc.color), rank = +sq[1];
  const sub = (rank === 1 || rank === 8) ? 'n' : 'p';
  b[r][f] = enemy === 'w' ? sub.toUpperCase() : sub;
  return capturersOn(boardFen(b, fen.split(' ').slice(1).join(' ')), sq, pc.color);
}
function capturesFrom(fen, sq){ const pc = new Chess(fen).get(sq); if(!pc) return []; const f = asTurn(fen, pc.color); if(!f) return []; return new Chess(f).moves({square:sq, verbose:true}).filter(m => m.captured); }
function mobility(fen, sq){ const pc = new Chess(fen).get(sq); if(!pc) return 0; const f = asTurn(fen, pc.color); if(!f) return 0; return new Chess(f).moves({square:sq}).length; }
function attackPairs(fen, color){ const f = asTurn(fen, color); if(!f) return []; return new Chess(f).moves({verbose:true}).filter(m => m.captured && m.captured !== 'p').map(m => ({from:m.from, to:m.to, piece:m.piece, target:m.captured})); }
function pinFrom(fen, sq){

  if(d.kind !== 'chesscom'){
    const rec = {id:d.gid, src:'casilla', kind:d.kind || 'partida', title:d.title || '', opp:d.opp || '', user:uc, start:d.startFen, sans:E.moves.map(m => m.san),
      res:(d.result && d.result.res) || null, why:(d.result && d.result.why) || '', end:date};
    S.played = (S.played || []).filter(g => g.id !== rec.id);
    S.played.push(rec); S.played.sort((a,b) => b.end - a.end); S.played = S.played.slice(0, 300);

/* ---------- Comentario general del maestro ---------- */
function evalNarrative(E){
  const d = E.desc, uc = E.user, prof = playerModel(), out = [];
  const res = d.result && d.result.res;
  const resTxt = res === 'w' ? 'Ganaste' : res === 'l' ? 'Perdiste' : res === 'd' ? 'Hiciste tablas' : 'Terminó la partida';
  out.push(resTxt + (d.result && d.result.why ? ' (' + d.result.why.toLowerCase() + ')' : '') + '. Tu precisión fue de ' + (E.userAcc ?? 0) + '% y la de ' + (d.opp || 'tu rival') + ' de ' + (E.oppAcc ?? 0) + '%.');
  const endOpen = Math.min(E.per.length, Math.max(8, E.per.findIndex(p => p.phase !== 'Apertura')));
  if(endOpen >= 8 && E.W[endOpen] !== undefined){
    const v = (uc === 'w' ? 1 : -1) * E.W[endOpen];
    const name = (posKey(d.startFen) === posKey(START_FEN) ? openingOf(E.moves.map(m => m.san)) : null) || (d.opening || null);
    out.push('Apertura' + (name ? ' (' + name + ')' : '') + ': al salir de ella, después de la jugada ' + Math.ceil(endOpen / 2) + ', ' + evalWords(v) + '.');
  }
  const t = E.turn;
  if(t && t.drop >= 20){
    const who = t.color === uc ? 'tuyo' : 'de ' + (d.opp || 'tu rival');
    out.push('El momento decisivo fue ' + moveLabel(E.fens[t.i], t.san) + ', un error ' + who + ': la evaluación pasó de ' + fmtEval((uc === 'w' ? 1 : -1) * E.W[t.i]) + ' a ' + fmtEval((uc === 'w' ? 1 : -1) * E.W[t.i+1]) + ' (desde tu lado).');
  }
  const missed = E.keys.filter(k => k.type === 'missed').length;
  if(missed) out.push('Tu rival se equivocó y no lo aprovechaste en ' + missed + (missed > 1 ? ' ocasiones.' : ' ocasión.'));
  const ph = Object.entries(E.phaseAcc).filter(([k]) => E.per.filter(p => p.color === uc && p.phase === k).length >= 3);
  if(ph.length >= 2){

    out.push('Por fase: ' + ph.map(([k,v]) => k.toLowerCase() + ' ' + v + '%').join(', ') + '. Tu punto débil hoy fue ' + (worst[0] === 'Final' ? 'el final' : worst[0] === 'Apertura' ? 'la apertura' : 'el medio juego') + '.');

  else if(Object.keys(cats).length) out.push('Tu error más repetido hoy: ' + Object.entries(cats).sort((a,b) => b[1] - a[1])[0][0].toLowerCase() + '.');
  E.todayCats = cats;
  return out;
}
function deepMoment(E, k){

    facts:{tipo:k.type === 'missed' ? 'oportunidad perdida' : 'error', jugada:moveLabel(fen0, P.san), gravedad:sevName, eval_antes:fmtEval(P.before), eval_despues:fmtEval(P.after), categoria:cause.cat, causa:cause.text, linea_tras_tu_jugada:lineTextPlain(ref), mejor_jugada:idea, linea_mejor:lineTextPlain(bestL)}};

/* ---------- Comentario de cada jugada, para recorrer la partida ---------- */
const MOVE_KIND = {best:'La mejor', great:'Excelente', good:'Buena', ok:'Correcta', book:'Teoría', forced:'Única jugada', inacc:'Imprecisión', mistake:'Error', blunder:'Error grave', miss:'Oportunidad perdida', allow:'Permite mate', mate:'Jaque mate'};
const ERR_KINDS = ['inacc', 'mistake', 'blunder', 'miss', 'allow'];
function evalNow(v){
  if(v >= 1450) return 'tienes mate forzado';
  if(v <= -1450) return 'tu rival tiene mate forzado';
  const x = fmtEval(v);
  if(v >= 200) return 'vas mejor (' + x + ')';
  if(v >= 70) return 'vas ligeramente mejor (' + x + ')';
  if(v <= -200) return 'vas peor (' + x + ')';
  if(v <= -70) return 'vas ligeramente peor (' + x + ')';
  return 'la posición está equilibrada (' + x + ')';
}
function evalThen(v){
  if(v >= 1450) return 'tenías mate forzado';
  if(v <= -1450) return 'tu rival tenía mate forzado';
  const x = fmtEval(v);
  if(v >= 200) return 'ibas mejor (' + x + ')';
  if(v >= 70) return 'ibas ligeramente mejor (' + x + ')';
  if(v <= -200) return 'ibas peor (' + x + ')';
  if(v <= -70) return 'ibas ligeramente peor (' + x + ')';
  return 'la posición estaba equilibrada (' + x + ')';
}
// Jugada de teoría: la partida sigue, hasta aquí, alguna línea de OPENINGS. Se nombra solo si es una sola.
function bookName(E, i){
  if(posKey(E.desc.startFen) !== posKey(START_FEN)) return null;

// Qué hizo la jugada i, cómo cambió la evaluación y qué era mejor. Las evaluaciones van desde el lado del usuario.
function moveComment(E, i){
  const cache = E.notes || (E.notes = []);
  if(cache[i]) return cache[i];
  const P = E.per[i], m = E.moves[i], uc = E.user, mine = P.color === uc;
  const fen0 = E.fens[i], fen1 = E.fens[i+1], g1 = new Chess(fen1);
  const uv = k => (uc === 'w' ? 1 : -1) * E.W[k];
  const prev = i > 0 ? E.per[i-1] : null;
  const missed = !!(prev && prev.drop >= 20 && P.drop >= 10);
  const mateMissed = P.before >= 1450 && P.after < 1450;
  const book = bookName(E, i), inBook = book !== null;
  let k;
  if(g1.in_checkmate()) k = 'mate';
  else if(new Chess(fen0).moves().length === 1) k = 'forced';
  else if(P.tag === '??') k = 'blunder';
  else if(P.tag && missed) k = 'miss';
  else if(P.tag === '?') k = 'mistake';
  else if(P.tag === '?!') k = 'inacc';
  else if(mateMissed) k = 'miss';
  else if(P.after <= -1450 && P.before > -1450 && !P.isBest) k = 'allow';   // ya perdida, pero ahora con mate forzado
  else if(inBook) k = 'book';
  else if(P.isBest) k = 'best';
  else if(P.drop < 2) k = 'great';
  else if(P.drop < 5) k = 'good';
  else k = 'ok';
  const castle = m.flags.includes('k') ? 'enroca corto' : m.flags.includes('q') ? 'enroca largo' : '';
  const what = k === 'mate' ? '' : [castle, moveNote(fen0, m, uc)].filter(Boolean).join(', ');
  const out = [(mine ? 'Jugaste ' : 'Tu rival jugó ') + moveLabel(fen0, P.san) + (what ? ': ' + what : '') + '.'];
  const evalLine = () => {
    const b = uv(i), a = uv(i+1);
    return Math.abs(winPct(a) - winPct(b)) >= 8 ? 'Antes ' + evalThen(b) + '; ahora ' + evalNow(a) + '.' : 'La evaluación casi no cambia: ' + evalNow(a) + '.';
  };
  const ended = g1.game_over();
  if(k === 'mate') out.push(mine ? 'Es jaque mate: ganaste la partida.' : 'Es jaque mate: tu rival gana la partida.');
  else if(g1.in_stalemate() || g1.insufficient_material()){
    out.push(g1.in_stalemate() ? 'Rey ahogado: la partida termina en tablas.' : 'Ya no queda material para dar mate: tablas.');
    if(P.before >= 70) out.push((mine ? 'Ibas mejor (' : 'Tu rival iba mejor (') + fmtEval(P.before) + ') y ' + (mine ? 'dejaste' : 'dejó') + ' escapar la ventaja.');
  }
  else if(k === 'forced'){ out.push('Era la única jugada legal.'); out.push(evalLine()); }
  else if(k === 'book') out.push('Es una jugada de teoría' + (book ? ', de la línea ' + book : '') + '.');
  else if(k === 'best'){
    out.push(mine ? 'Es la mejor jugada según Stockfish.' : 'Es la mejor jugada para tu rival.');
    const gain = lineGain(E, i, P.color, 4);
    if(gain >= 2 && P.before < 1450 && P.before > -1450) out.push((mine ? 'Con la continuación correcta ganas ' : 'Con la continuación correcta tu rival gana ') + matPhrase(gain) + '.');
    out.push(evalLine());
  } else if(!ERR_KINDS.includes(k)){
    const alt = P.bestSan;
    // Posiciones con mate de por medio: lo que importa es si el mate sigue

    else if(P.before >= 1450 && P.after >= 1450) out.push(mine ? 'Sigues con mate forzado' + (alt ? ', aunque ' + alt + ' lo daba más rápido' : '') + '.' : 'Tu rival sigue con mate forzado.');
    else {
      if(mine) out.push(k === 'great' ? 'Muy precisa: vale prácticamente lo mismo que la mejor' + (alt ? ', ' + alt : '') + '.' : k === 'good' ? 'Buena jugada.' + (alt ? ' Stockfish prefería ' + alt + ', pero la diferencia es pequeña.' : '') : 'Correcta' + (alt ? ', aunque ' + alt + ' era más precisa' : '') + '.');
      else out.push(k === 'ok' && alt ? 'Jugada aceptable de tu rival; ' + alt + ' era más precisa.' : 'Jugada sólida de tu rival.');
      out.push(evalLine());
    }
  } else if(mine){
    if(missed) out.push('Tu rival acababa de equivocarse con ' + prev.san + ' y esta jugada no lo aprovecha.');
    let txt = '', cat = null;
    if(mateMissed || k === 'allow' || P.tag === '?' || P.tag === '??'){ const c = rootCause(E, i); txt = c.text; cat = c.cat; out.push(txt); }
    if(!/La evaluación pasó/.test(txt)) out.push(evalLine());
    // Con la respuesta del rival, la mejor jugada se explica por lo que evitaba (como en los momentos clave)
    const r1 = applyLine(fen1, E.pv[i+1], 1).moves[0];
    if(!mateMissed && E.best[i]) out.push(bestIdea(E, i, {r1, mate:P.after <= -1450, cat, short:true}));
  } else {
    if(mateMissed) out.push('Tu rival tenía mate forzado y lo dejó pasar.');
    else if(missed) out.push('Tu rival no aprovechó tu error de la jugada anterior.');
    else if(k === 'allow') out.push('Tu rival ya iba perdido y esta jugada además te deja dar mate.');
    else out.push('Es ' + ({inacc:'una imprecisión', mistake:'un error', blunder:'un error grave'}[k] || 'un error') + ' de tu rival.');
    if(P.bestSan) out.push('Su mejor jugada era ' + P.bestSan + '.');
    out.push(evalLine());
    if(!ended && E.best[i+1]){
      const gain = lineGain(E, i + 1, uc, 4), nx = E.per[i+1];

    }
  }
  // Amenazas nuevas que deja la jugada (solo en jugadas sin error, para no mezclar mensajes)
  if(!ended && !ERR_KINDS.includes(k) && !g1.in_check() && !new Chess(fen0).in_check() && Math.abs(P.after) < 1450){

    if(t1 && !(t0 && t0.sq === t1.sq && t0.from === t1.from) && !what.includes(pz(mine ? 'su' : 'tu', t1.target, t1.sq)))
      out.push(mine ? 'Ahora amenazas ' + pz('su', t1.target, t1.sq) + ' con ' + pz('tu', t1.piece, t1.from) + '.' : 'Ojo: ahora amenaza ' + pz('tu', t1.target, t1.sq) + ' con ' + pz('su', t1.piece, t1.from) + '.');
  }
  return (cache[i] = {i, kind:k, name:MOVE_KIND[k], mine, label:moveLabel(fen0, P.san) + (P.tag ? ' ' + P.tag : ''), text:out.join(' '), key:E.keys.some(x => x.i === i)});
}
function evalGraph(E, cur){
