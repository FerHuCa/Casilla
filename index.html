    const e = ENDGAMES.find(x => x.id === b.dataset.eg);
    if(!(await Engine.whenReady())) return;
    App.setSession(new PlaySession({fen:e.fen, userColor:e.fen.split(' ')[1], tier:STRONG, tierIdx:null, goal:{type:e.goal, moves:e.moves}, goalId:e.id, title:e.t, desc:e.d, backLabel:'Finales', back}));
  });
  $$('[data-op]', root).forEach(b => b.onclick = () => App.setSession(new OpeningSession(OPENINGS.find(o => o.id === b.dataset.op), b.dataset.side)));
  $$('[data-myop]', root).forEach(b => b.onclick = () => {
    const o = myOpenings()[+b.dataset.myop]; const g = buildGame(o.rec.pgn); const k = Math.min(16, g.fens.length - 1); const i = +$('#myopTier').value; App.playTier = i;
    const uc = o.rec.white.toLowerCase() === S.username.toLowerCase() ? 'w' : 'b';
    App.setSession(new PlaySession({fen:g.fens[k], userColor:uc, tier:TIERS[i], tierIdx:i, helps:true, title:o.name, desc:'Tu posición tras ' + k/2 + ' jugadas, contra ' + TIERS[i].n + '.', backLabel:'Aperturas', back}));
  });
  const tg = $('#toGames'); if(tg) tg.onclick = () => switchTab('games');
  const rs = $('#recSess'); if(rs) rs.onclick = () => { App.mineFocus = errorProfile().ranked.slice(0,2).map(x => x[0]); App.puzzleSource = 'mine'; switchTab('puzzles'); };
  bindSeg(root, 'cat', v => { App.mineFocus = v === 'all' ? null : [v]; renderPositionsHome(); });
  const findM = id => errorProfile().all.find(m => m.id === id);
  $$('[data-mz]', root).forEach(b => b.onclick = () => { const m = findM(b.dataset.mz); App.tab = 'puzzles'; $$('.tab').forEach(x=>x.setAttribute('aria-selected', x.dataset.tab==='puzzles')); App.setSession(new PuzzleSession(mistakePuzzle(m))); });
  $$('[data-mp]', root).forEach(b => b.onclick = () => { const m = findM(b.dataset.mp); const i = +$('#mineTier').value; App.playTier = i;
    App.setSession(new PlaySession({fen:m.fen, userColor:m.color, tier:TIERS[i], tierIdx:i, helps:true, title:'Revancha de tu error', desc:'Contra ' + m.opp + ' jugaste ' + m.played + '. Ahora juega mejor contra ' + TIERS[i].n + '.', backLabel:'De mis partidas', back})); });
  const fp = $('#fenPlay');
  if(fp){
    const getFen = () => { const f = $('#fenin').value.trim(); const v = new Chess().validate_fen(f); if(!v.valid){ $('#fenerr').textContent = 'FEN no válido: ' + v.error; return null; } $('#fenerr').textContent = ''; return f; };
    fp.onclick = () => { const f = getFen(); if(!f) return; const i = +$('#fenTier').value; App.playTier = i; App.setSession(new PlaySession({fen:f, userColor:f.split(' ')[1], tier:TIERS[i], tierIdx:i, helps:$('#fenHelps').checked, title:'Posición personalizada', backLabel:'Posiciones', back})); };
    $('#fenAna').onclick = () => { const f = getFen(); if(f) App.setSession(new AnalysisSession({fen:f, title:'Análisis de posición', backLabel:'Posiciones', back})); };
    $('#fenLoad').onclick = () => { const f = getFen(); if(f){ App.game = new Chess(f); Board.orient = f.split(' ')[1]; Board.layout(); Board.render(); } };
  }
}
function myOpenings(){
  if(!S.username) return [];
  const map = {};
  for(const g of S.games){ if(!g.pgn) continue; const n = openingName(g).split(' ').slice(0, 4).join(' '); const o = map[n] || (map[n] = {name:n, n:0, w:0, d:0, l:0, rec:g}); o.n++; o[gameResult(g)]++; }
  return Object.values(map).filter(o => o.n >= 2 && o.name !== 'Apertura desconocida').sort((a,b) => b.n - a.n).slice(0, 8);
}

/* ---------- Progreso ---------- */
function sparkline(hist){
  if(hist.length < 2) return '';
  const vals = hist.slice(-60).map(h => h.r); const mn = Math.min(...vals) - 10, mx = Math.max(...vals) + 10;
  const pts = vals.map((v,i) => (i/(vals.length-1)*100).toFixed(2) + ',' + (56 - (v-mn)/(mx-mn)*52).toFixed(2)).join(' ');
  return '<svg class="spark" viewBox="0 0 100 60" preserveAspectRatio="none" role="img" aria-label="Evolución del rating de puzzles"><polyline points="' + pts + '" fill="none" stroke="#CFCAC2" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg><p class="note">Últimos ' + vals.length + ' puzzles: de ' + vals[0] + ' a ' + vals[vals.length-1] + '.</p>';
}
function renderProgressHome(){
  const P = S.puzzles, p = errorProfile();
  const an = Object.values(S.analyses); const accs = an.filter(a => a.acc).map(a => a.acc);
  const beaten = S.ladder.unlocked - 1;
  const top = p.ranked[0];
  side().innerHTML = '<h2>Progreso</h2>' +
    '<div class="stats"><div class="stat"><span class="big">' + beaten + '/8</span><span>Niveles superados</span></div><div class="stat"><span class="big">' + P.rating + '</span><span>Rating de puzzles</span></div><div class="stat"><span class="big">' + (accs.length ? Math.round(accs.reduce((a,b)=>a+b,0)/accs.length) + '%' : '–') + '</span><span>Precisión media</span></div></div>' +
    '<h3>Puzzles</h3><p class="note">' + P.solved + ' resueltos, ' + P.failed + ' fallados. Mejor racha: ' + P.best + '.</p>' + sparkline(P.hist) +
    '<h3>Tus errores comunes</h3>' + (p.total ?
      p.ranked.map(([c,nn]) => '<div class="catrow"><span>' + esc(c) + '</span><span class="note">' + Math.round(100*nn/p.total) + '%</span></div><div class="bar"><i style="width:' + (100*nn/p.total) + '%"></i></div>').join('') +
      '<p class="note">Por fase: ' + ['Apertura','Medio juego','Final'].map(f => f.toLowerCase() + ' ' + (p.phases[f]||0)).join(', ') + '. ' + (p.games ? (p.total/p.games).toFixed(1) + ' errores por partida.' : '') + '</p>' +
      '<div class="result warn"><strong>Recomendación</strong>Tu patrón más frecuente es ' + esc(top[0].toLowerCase()) + '. Entrena tus propias posiciones y después puzzles del tema relacionado.</div>' +
      '<div class="row"><button class="btn primary" id="trMine">Entrenar mis errores</button><button class="btn" id="trTheme">Puzzles: ' + esc((THEMES.find(t => t[0] === CAT_THEME[top[0]]) || [0,'Mezcla'])[1]) + '</button></div>'
      : '<p class="note">Aún no hay partidas analizadas.</p>') +
    '<h3>Finales y aperturas</h3><p class="note">' + Object.keys(S.endgames).length + ' de ' + ENDGAMES.length + ' finales completados. ' + Object.keys(S.openings).length + ' líneas de apertura repasadas.</p>' +
    '<h3>Tus datos</h3><p class="note">Todo se guarda en este navegador. Exporta un respaldo si cambias de equipo o de navegador.</p>' +
    '<div class="row"><button class="btn" id="exp">Exportar respaldo</button><button class="btn" id="imp">Importar respaldo</button><button class="btn" id="rst">Borrar todo</button><input type="file" id="impf" accept="application/json" hidden></div>';
  const tm = $('#trMine'); if(tm) tm.onclick = () => { App.mineFocus = [top[0]]; App.puzzleSource = 'mine'; switchTab('puzzles'); };
  const tt = $('#trTheme'); if(tt) tt.onclick = () => { App.puzzleTheme = CAT_THEME[top[0]] || 'mix'; App.puzzleSource = 'lichess'; switchTab('puzzles'); };
  $('#exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:'application/json'})); a.download = 'casilla-respaldo-' + new Date().toISOString().slice(0,10) + '.json'; a.click(); };
  $('#imp').onclick = () => $('#impf').click();
  $('#impf').onchange = async e => { const f = e.target.files[0]; if(!f) return; try{ S = Object.assign(defaults(), JSON.parse(await f.text())); save(); toast('Respaldo importado.'); renderProgressHome(); }catch(err){ toast('Ese archivo no es un respaldo válido.'); } };
  $('#rst').onclick = () => { if(confirm('¿Borrar todo tu progreso, partidas y análisis guardados?')){ S = defaults(); save(); renderProgressHome(); } };
}
const HOMES = {ladder:renderLadderHome, positions:renderPositionsHome, games:renderGamesHome, progress:renderProgressHome};

/* =========================================================
   Arranque
   ========================================================= */
function boot(){
  if(typeof Chess === 'undefined'){
    side().innerHTML = '<h2>Sin conexión</h2><p class="lede">Casilla necesita internet para descargar la librería de ajedrez y Stockfish. Conéctate y recarga la página.</p>';
    setPill('err', 'Sin conexión'); return;
  }
  Board.init();
  $$('.tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  switchTab('ladder');
  Engine.init();
}
boot();
</script>
</body>
